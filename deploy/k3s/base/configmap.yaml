  TENANT_BASE_DOMAIN: "dentistes.2mes4.com"
  K8S_PROVISIONING: "true"
  WEB_SERVICE_NAME: "web"
  WEB_SERVICE_PORT: "8080"
  TLS_ISSUER: "letsencrypt-prod"
  PROVISION_INTERVAL: "30s"
