apiVersion: v1
kind: Service
metadata:
  name: marketing
  labels:
    app.kubernetes.io/name: marketing
spec:
  selector:
    app.kubernetes.io/name: marketing
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing
  labels:
    app.kubernetes.io/name: marketing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: marketing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: marketing
          image: dentistes/marketing:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
