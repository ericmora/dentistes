apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dentistes-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 999
          containers:
            - name: backup
              image: dentistes/backup:latest
              imagePullPolicy: Always
              env:
                - name: PGHOST
                  value: postgres
                - name: PGDATABASE
                  value: dentistes
                - name: PGUSER
                  value: dentistes
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dentistes-secrets
                      key: postgres-password
                - name: BACKUP_DIR
                  value: /backups
                - name: RETENTION_DAYS
                  value: "14"
                - name: RCLONE_REMOTE
                  value: ""
                - name: RCLONE_CONFIG
                  value: /config/rclone/rclone.conf
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: rclone
                  mountPath: /config/rclone
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: dentistes-backups
            - name: rclone
              secret:
                secretName: dentistes-rclone
                optional: true
