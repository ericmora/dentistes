apiVersion: v1
kind: ServiceAccount
metadata:
  name: dentistes-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dentistes-api-ingress
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dentistes-api-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dentistes-api-ingress
subjects:
  - kind: ServiceAccount
    name: dentistes-api
